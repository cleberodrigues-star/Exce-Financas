<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EXCE Finanças</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--az:#0f3f94;--az2:#0a2c6b;--ouro:#c8961e;--bg:#f4f7fc;--card:#fff;--tx:#17233b;--mut:#66728c;--bd:#dde4f0;--lk:#0f3f94;--ok:#17803f;--er:#c0392b;--wr:#a8710c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#151e33;--tx:#e8edf8;--mut:#98a5c2;--bd:#26324d;--lk:#8fb2f5;--ok:#4cc57e;--er:#f0786a;--wr:#e5b04a}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#151e33;--tx:#e8edf8;--mut:#98a5c2;--bd:#26324d;--lk:#8fb2f5;--ok:#4cc57e;--er:#f0786a;--wr:#e5b04a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--az2);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--ouro)}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px}.top img{height:38px;background:#fff;border-radius:8px;padding:2px 6px}.top b{color:#fff;font-size:13px;line-height:1.2}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 8px 8px}nav button{flex:none;background:transparent;border:0;color:#cfdaf3;padding:7px 12px;border-radius:20px;font:600 13px Manrope,sans-serif;cursor:pointer}nav button.on{background:var(--ouro);color:#1b1400}
main{max-width:1000px;margin:0 auto;padding:14px 12px 60px}h2{margin:4px 0 12px;color:var(--lk);font-size:21px}h3{margin:0 0 10px;color:var(--lk)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;border-left:4px solid var(--az)}.k small{color:var(--mut);display:block}.k b{font-size:17px}.k.e{border-left-color:var(--er)}.k.o{border-left-color:var(--ok)}.k.d{border-left-color:var(--ouro)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar span:first-child{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{display:block;height:14px;border-radius:7px;background:var(--az);min-width:2px}.bar em{font-style:normal;color:var(--mut);white-space:nowrap}
.f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);min-width:0}label{display:block;font-weight:600;font-size:13px;margin:8px 0 3px;color:var(--mut)}label input,label select{width:100%}label.c{display:flex;gap:8px;align-items:center;color:var(--tx)}label.c input{width:auto}
button{font:600 14px Manrope,sans-serif;cursor:pointer;border-radius:8px;padding:9px 14px;border:1px solid var(--az)}.bp{background:var(--az);color:#fff}.bs{background:transparent;color:var(--lk)}.bd{background:var(--er);border-color:var(--er);color:#fff}button:disabled,input:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ouro);outline-offset:1px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:720px}th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:var(--az2);color:#fff;cursor:pointer;font-weight:600}td.n,th.n{text-align:right}tfoot td{font-weight:800}
.b{padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700}.b.Recebida,.b.Paga{background:#d9f3e3;color:#0e6a31}.b.A{background:#e3ecfb;color:#0f3f94}.b.Atrasada{background:#fde0dc;color:#a52d20}
.al{background:#fff4d6;border:1px solid var(--ouro);color:#5b4200;border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(5,15,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:20}.ov[hidden]{display:none}.mb{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:520px;margin-top:3vh}.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#sp{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .5s;color:#0f3f94;font-weight:800;text-align:center;padding:20px}#sp img{width:min(320px,80%)}
#ts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--az2);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90%}
.pg{height:8px;background:var(--bd);border-radius:4px}.pg i{display:block;height:8px;background:var(--ouro);border-radius:4px}.mu{color:var(--mut)}
#lg{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}#lg[hidden]{display:none}#lg .mb{margin:0;border:1px solid var(--bd)}#lg img{height:48px;background:#fff;border-radius:8px;padding:2px 8px;border:1px solid var(--bd);margin-bottom:10px}
</style></head><body>
<div id="lg"><div class="mb"><img id="lgi" alt="EXCE"><h3>Entrar no EXCE Finanças</h3><p class="mu" style="margin-top:0">Entre com sua conta para ter os mesmos dados no celular e no computador.</p><label>E-mail<input id="lem" type="email" autocomplete="username" inputmode="email"></label><label>Senha<input id="lpw" type="password" autocomplete="current-password"></label><p id="lerr" style="color:var(--er);min-height:1.3em;margin:10px 0 0"></p><div class="bt" style="margin-top:8px"><button class="bp" id="lin">Entrar</button><button class="bs" id="lnew">Criar conta</button></div><p style="margin:14px 0 0"><a href="#" id="lrst" style="color:var(--lk)">Esqueci a senha</a></p><p id="lw" class="mu" style="font-size:12px;margin:10px 0 0">Carregando… se esta tela não responder, verifique a internet.</p></div></div><script>if(localStorage.getItem('exce_uid'))document.getElementById('lg').hidden=true</script>

<main id="app"></main><div class="ov" id="md" hidden><div class="mb" id="mc"></div></div><div id="ts" hidden></div>
<script>
const g=i=>document.getElementById(i),p2=n=>String(n).padStart(2,'0'),R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),D=s=>s?s.split('-').reverse().join('/'):'',uid=()=>Math.random().toString(36).slice(2,9),r2=n=>Math.round(n*100)/100;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
function addM(s,n){const[y,m,d]=s.split('-').map(Number),t=new Date(y,m-1+n,1),l=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(Math.min(d,l))}
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const C0=[['Salário','E',1,0],['Outras receitas','E',0,0],['Moradia','S',1,0],['Energia e água','S',1,0],['Alimentação','S',0,0],['Cartão de crédito','S',0,1],['Compras parceladas','S',0,1],['Saúde','S',0,0],['Transporte','S',0,0]];
let db=null;try{db=JSON.parse(localStorage.getItem('exce')||'null')}catch(e){}
db=db||{saldo:{},contas:C0.map(c=>({id:uid(),nome:c[0],tipo:c[1],ativa:1,rep:c[2],parc:c[3]})),lan:[],fits:[]};
const save=()=>{try{localStorage.setItem('exce',JSON.stringify(db));localStorage.setItem('exce_ts',Date.now())}catch(e){}window._cloudSave&&window._cloudSave()};
const now=new Date();let view='dash',F={ano:now.getFullYear(),mes:now.getMonth()+1,tipo:'',conta:'',st:'',q:'',ord:'venc',dir:1};
const cta=id=>db.contas.find(c=>c.id==id),cn=id=>id=='PEND'?'PENDENTE DE CLASSIFICAÇÃO':(cta(id)||{nome:'—'}).nome;
const pago=l=>l.valBx>0,st=l=>pago(l)?(l.tipo=='E'?'Recebida':'Paga'):l.venc<hoje()?'Atrasada':(l.tipo=='E'?'A receber':'A pagar');
const bd=s=>`<span class="b ${s.split(' ')[0]}">${s}</span>`,sum=(a,f)=>r2(a.reduce((s,l)=>s+f(l),0));
const opts=(a,v)=>a.map(([k,t])=>`<option value="${k}"${k==v?' selected':''}>${t}</option>`).join('');
const anos=()=>{const y=now.getFullYear(),a=[];for(let i=y-3;i<=y+3;i++)a.push([i,i]);return a};
const meses=z=>(z?[[0,'Ano todo']]:[]).concat(MES.map((m,i)=>[i+1,m]));
function toast(t){const e=g('ts');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3500)}
const openM=h=>{g('mc').innerHTML=h;g('md').hidden=false},closeM=()=>{g('md').hidden=true;if(window._pr){window._pr=0;render()}};
const ask=(m,b)=>new Promise(r=>{window._r=v=>{closeM();r(v)};openM(`<p>${m}</p><div class="bt">${b.map(([v,t,c])=>`<button class="${c||'bs'}" onclick="_r('${v}')">${t}</button>`).join('')}</div>`)});
const contaCard=()=>window._u?`<div class="card"><h3>Conta e sincronização</h3><p class="mu" style="margin:0 0 10px">Conectado como <b>${esc(window._u)}</b><br><span id="sy">${esc(window._sy||'')}</span></p><div class="bt" style="margin:0"><button class="bs" onclick="_cloudOut()">Sair da conta</button></div></div>`:'';
const abc=(a,b)=>(a.tipo==b.tipo?0:a.tipo=='E'?-1:1)||a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'});
const NAV=[['dash','Dashboard'],['ent','Entradas'],['sai','Saídas'],['lan','Lançamentos'],['pc','Plano de Contas'],['par','Parcelamentos'],['rel','Relatórios'],['cfg','Configurações'],['sob','Sobre']];
function go(v){view=v;if(v=='ent')F.tipo='E';if(v=='sai')F.tipo='S';if(v=='lan'&&F.tipo&&!F._k)F.tipo='';render();scrollTo(0,0)}
function render(){g('nv').innerHTML=NAV.map(([k,t])=>`<button class="${k==view?'on':''}" onclick="go('${k}')">${t}</button>`).join('');g('app').innerHTML=V[view]()}
const per=()=>`<div class="f"><select onchange="F.mes=+this.value;render()">${opts(meses(view!='dash'),F.mes)}</select><select onchange="F.ano=+this.value;render()">${opts(anos(),F.ano)}</select></div>`;
const inP=l=>l.venc.slice(0,4)==F.ano&&(!+F.mes||+l.venc.slice(5,7)==F.mes);
function tot(a,t){const x=a.filter(l=>l.tipo==t);return{tot:sum(x,l=>l.valor),rec:sum(x,l=>l.valBx),aber:sum(x.filter(l=>!pago(l)&&st(l)!='Atrasada'),l=>l.valor),atr:sum(x.filter(l=>st(l)=='Atrasada'),l=>l.valor)}}

 'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.',
 'auth/operation-not-allowed':'Login por e-mail/senha ainda não foi ativado no Firebase.',
 'auth/unauthorized-domain':'Este endereço não está autorizado no Firebase (Domínios autorizados).'
};
const showErr=e=>{$('lerr').textContent=ERR[e.code]||('Não foi possível continuar ('+(e.code||e.message)+').')};
const cred=()=>[$('lem').value.trim(),$('lpw').value];
async function go(fn){
 $('lerr').textContent='';
 const [m,p]=cred();
 if(!m||!p){$('lerr').textContent='Digite e-mail e senha.';return}
 $('lin').disabled=$('lnew').disabled=true;
 try{await fn(auth,m,p)}catch(e){showErr(e)}
 $('lin').disabled=$('lnew').disabled=false;
}
$('lgi').src=document.querySelector('.top img').src;
$('lw').textContent='';
$('lin').onclick=()=>go(signInWithEmailAndPassword);
$('lnew').onclick=()=>go(createUserWithEmailAndPassword);
$('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lin').click()});
$('lrst').onclick=async e=>{
 e.preventDefault();$('lerr').textContent='';
 const m=$('lem').value.trim();
 if(!m){$('lerr').textContent='Digite seu e-mail acima e toque em "Esqueci a senha".';return}
 try{await sendPasswordResetEmail(auth,m);$('lerr').style.color='var(--ok)';$('lerr').textContent='Enviamos um link para redefinir a senha, se esse e-mail tiver conta.'}
 catch(x){$('lerr').style.color='var(--er)';showErr(x)}
};
window._cloudClear=async()=>{
 if(!ref)return;
 if(!navigator.onLine)throw new Error('offline');
 clearTimeout(timer);
 await wait(deleteDoc(ref),8000);
};
window._cloudOut=async()=>{
 if(await window._ask('Sair da conta neste aparelho? Seus dados continuam salvos na nuvem.',[['y','Sair','bd'],['x','Cancelar','bs']])!='y')return;
 if(!navigator.onLine)return toast('Conecte-se à internet para sair, assim nenhum dado se perde.');
 if(timer){clearTimeout(timer);timer=null;await push()}
 if(/Sem conexão/.test(window._sy||''))return toast('Não foi possível enviar os dados agora. Tente de novo em instantes.');
 try{await signOut(auth)}catch(e){}
 LS.removeItem('exce');LS.removeItem('exce_ts');LS.removeItem('exce_uid');
 location.reload();
};
window.addEventListener('online',()=>{if(ref)reconcile().then(c=>{if(c)renderSafe()}).catch(()=>{})});
window.addEventListener('offline',()=>{if(ref)setSt('⚠️ Sem conexão')});
onAuthStateChanged(auth,async u=>{
 if(!u){
  if(unsub){unsub();unsub=null}
  ref=null;window._u='';$('lg').hidden=false;return;
 }
 const lu=LS.getItem('exce_uid');
 if(lu&&lu!==u.uid){
  LS.removeItem('exce');LS.removeItem('exce_ts');LS.setItem('exce_uid',u.uid);
  location.reload();return;
 }
 LS.setItem('exce_uid',u.uid);
 window._u=u.email;
 ref=doc(fs,'usuarios',u.uid);
 $('lg').hidden=true;
 setSt('Sincronizando…');
 let ch=false;
 try{ch=await reconcile();setSt('☁️ Sincronizado')}catch(e){setSt('⚠️ Sem conexão. Usando os dados salvos neste aparelho.')}
 if(ch){render()}else if(typeof view!=='undefined'&&view==='cfg'&&$('md').hidden){render()}
 if(unsub)unsub();
 unsub=onSnapshot(ref,s=>{
  if(!s.exists()||s.metadata.hasPendingWrites)return;
  const d=s.data();
  if(d.ts>lts()){apply(d);renderSafe()}
 },()=>{});
});
</script></body></html>
